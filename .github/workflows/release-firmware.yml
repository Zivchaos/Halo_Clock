name: Publish release firmware

on:
  push:
    tags:
      - "v*"
      - "israeli-red-alert-v*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build release firmware
        run: platformio run --project-conf platformIO.ini
      - name: Name release firmware
        id: firmware
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == israeli-red-alert-v* ]]; then
            echo "file=halo-cst-israeli-red-alert-${tag}.bin" >> "$GITHUB_OUTPUT"
            echo "title=HALO CST Israeli Red Alert ${tag#israeli-red-alert-v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == v* ]]; then
            echo "file=halo-cst-${tag}.bin" >> "$GITHUB_OUTPUT"
            echo "title=HALO CST ${tag#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release tags must use v* or israeli-red-alert-v*." >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes="docs/releases/${tag}.md"
          test -f "$notes"
          gh release create "$tag" --draft \
            --title "${{ steps.firmware.outputs.title }}" \
            --notes-file "$notes"
      - name: Attach firmware to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            ".pio/build/esp32dev/firmware.bin#${{ steps.firmware.outputs.file }}" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false \
            --prerelease=${{ steps.firmware.outputs.prerelease }}
