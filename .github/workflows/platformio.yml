name: Firmware build

on:
  push:
    branches:
      - main
      - feature/Israeli-Red-Alert
  pull_request:
    branches:
      - main
      - feature/Israeli-Red-Alert
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build HALO CST firmware
        run: platformio run --project-conf platformIO.ini
      - name: Build OTA firmware
        run: platformio run --project-conf platformIO.ini -e esp32dev_ota
      - name: Build embedded unit-test targets
        run: |
          # These tests target ESP32 hardware. GitHub Actions has no serial
          # target, so CI compiles each test binary only. Running the suite is
          # an explicit local hardware step and must never replace a clock's
          # production firmware accidentally.
          platformio test --project-conf platformIO.ini -e weather_tests --without-uploading --without-testing
          platformio test --project-conf platformIO.ini -e diagnostics_tests --without-uploading --without-testing
          platformio test --project-conf platformIO.ini -e network_tests --without-uploading --without-testing
          platformio test --project-conf platformIO.ini -e red_alert_tests --without-uploading --without-testing
      - name: Name firmware artifact
        id: firmware
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "feature/Israeli-Red-Alert" ]]; then
            echo "file=halo-cst-israeli-red-alert.bin" >> "$GITHUB_OUTPUT"
            echo "artifact=halo-cst-israeli-red-alert" >> "$GITHUB_OUTPUT"
          else
            echo "file=halo-cst.bin" >> "$GITHUB_OUTPUT"
            echo "artifact=halo-cst" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare firmware artifact
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin "dist/${{ steps.firmware.outputs.file }}"
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.firmware.outputs.artifact }}
          path: dist/${{ steps.firmware.outputs.file }}
          if-no-files-found: error
          retention-days: 30
