<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HALO CST social card</title>
  <desc id="desc">HALO CST brand card with an illuminated octagonal clock.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="45%" r="70%"><stop stop-color="#102a36"/><stop offset="1" stop-color="#070b0e"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
