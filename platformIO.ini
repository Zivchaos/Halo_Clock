; ==============================================================================
; HALO CST Firmware
; PlatformIO Configuration
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_halo_4mb.csv

monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<*>

build_unflags =
    -std=gnu++11

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.15.1
    bblanchon/ArduinoJson @ ^7.4.2
    olikraus/U8g2 @ ^2.36.5
    tzapu/WiFiManager @ ^2.0.17

monitor_filters =
    colorize
    esp32_exception_decoder

upload_protocol = esptool

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota

; Board-specific recovery build for the replacement ESP32 wired with OLED SDA/SCL
; on GPIO16/GPIO17. The standard esp32dev build remains GPIO21/GPIO22.
[env:esp32dev_oled16_17]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DHALO_OLED_SDA=16
    -DHALO_OLED_SCL=17

[env:weather_tests]
extends = env:esp32dev
test_filter = test_weather_parser
test_build_src = true
build_src_filter =
    +<WeatherProvider.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2

[env:diagnostics_tests]
extends = env:esp32dev
test_filter = test_diagnostics
test_build_src = true
build_src_filter =
    +<DiagnosticsService.cpp>

[env:network_tests]
extends = env:esp32dev
test_filter = test_network_config
test_build_src = true
build_src_filter =
    +<NetworkConfig.cpp>

[env:red_alert_tests]
extends = env:esp32dev
test_filter = test_red_alert_provider
test_build_src = true
build_src_filter =
    +<RedAlertProvider.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
